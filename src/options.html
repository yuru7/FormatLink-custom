    <div id="formatList">

      <div class="formatItem">
        <div class="formatItemHeader">
          <span class="formatItemTitle">Format 1</span>
          <label class="defaultLabel">
            <input type="radio" name="defaultFormat" id="defaultFormat1" value="1" aria-label="Use format 1 as default">
            Default
          </label>
          <div class="moveControls">
            <button type="button" class="moveButton" data-index="1" data-direction="up" aria-label="Move item 1 up"
              title="Move up" disabled>↑</button>
            <button type="button" class="moveButton" data-index="1" data-direction="down" aria-label="Move item 1 down"
              title="Move down">↓</button>
          </div>
        </div>
        <div class="formatField">
          <label for="title1">Title</label>
          <input type="text" id="title1">
        </div>
        <div class="formatField">
          <label for="format1">Format</label>
          <textarea id="format1" rows="1"></textarea>
        </div>
        <div class="formatOptions">
          <label for="selectionNewlines1">Selected text line breaks</label>
          <select id="selectionNewlines1" aria-label="Selected text line breaks for format 1">
            <option value="spaces" selected>Convert to spaces</option>
            <option value="preserve">Keep newlines as-is</option>
          </select>
          <div class="htmlOption">
            <input type="checkbox" id="html1" aria-label="Copy as HTML for format 1">
            <label for="html1">Copy as HTML</label>
          </div>
        </div>
      </div>
