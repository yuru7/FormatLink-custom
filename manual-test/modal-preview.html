<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Format Link Custom - mobile modal preview</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    __MODAL_CSS__
  </style>
</head>
<body>
  <div class="modal format-link-ui" role="dialog" aria-modal="true" aria-label="Format Link">
    <div class="preview">
      <div class="preview-header">
        <label for="textToCopy">Link Text</label>
        <span id="copyResult" class="is-visible">✔ Copied</span>
        <button type="button" class="close-button" id="closeButton" aria-label="Close">×</button>
      </div>
      <textarea id="textToCopy">[Example Title](https://example.test/)</textarea>
      <button type="button" id="copyButton">Copy</button>
      <button type="button" id="copyAllTabsButton" hidden>Copy all selected tabs</button>
    </div>
    <div class="formats">
      <div class="section-label">Switch Format</div>
      <div id="formatGroup">
        <label><input type="radio" name="format" checked> Markdown</label>
        <label><input type="radio" name="format"> Text</label>
        <label><input type="radio" name="format"> HTML</label>
        <label><input type="radio" name="format"> reST</label>
        <label><input type="radio" name="format"> LaTeX</label>
      </div>
    </div>
    <footer class="popup-footer">
      <a href="#" id="openOptionsLink">Options</a>
    </footer>
  </div>
</body>
</html>
