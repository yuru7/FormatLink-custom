<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>FormatLink Extension's Popup</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js"></script>
</head>

<body>
  <div class="preview">
    <div class="preview-header">
      <label for="textToCopy">Link Text</label>
      <span id="copyResult">✔ Copied</span>
    </div>
    <textarea id="textToCopy"></textarea>
    <button type="button" id="copyButton">Copy (Ctrl+Enter)</button>
  </div>

  <div class="formats">
    <div class="section-label">Switch Format</div>
    <div id="formatGroup"></div>
  </div>

  <div class="footer">
    <button type="button" id="saveDefaultFormatButton">Set as default</button>
  </div>
</body>

</html>
