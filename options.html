<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>FormatLink settings</title>
  <link rel="stylesheet" href="options.css">
  </link>
  <script src="options.js"></script>
</head>

<body>
  <h1>FormatLink settings</h1>
  <form>

    <span class="label">Default</span>
    <span class="label">Move</span>
    <span class="label">Title</span>
    <span class="label">Format</span>
    <span class="label">Selected text line breaks</span>
    <span class="label">Copy as HTML</span>

    <input type="radio" name="defaultFormat" id="defaultFormat1" value="1" aria-label="Use format 1 as default">
    <div class="moveControls">
      <button type="button" class="moveButton" data-index="1" data-direction="up" aria-label="Move item 1 up"
        title="Move up" disabled>↑</button>
      <button type="button" class="moveButton" data-index="1" data-direction="down" aria-label="Move item 1 down"
        title="Move down">↓</button>
    </div>
    <input type="text" id="title1" placeholder="Title1"></input>
    <input type="text" id="format1" placeholder="Format1"></input>
    <select id="selectionNewlines1" aria-label="Selected text line breaks for format 1">
      <option value="spaces" selected>Convert to spaces</option>
      <option value="preserve">Keep newlines as-is</option>
    </select>
    <input type="checkbox" id="html1"></input>

    <input type="radio" name="defaultFormat" id="defaultFormat2" value="2" aria-label="Use format 2 as default">
    <div class="moveControls">
      <button type="button" class="moveButton" data-index="2" data-direction="up" aria-label="Move item 2 up"
        title="Move up">↑</button>
      <button type="button" class="moveButton" data-index="2" data-direction="down" aria-label="Move item 2 down"
        title="Move down">↓</button>
    </div>
    <input type="text" id="title2" placeholder="Title2"></input>
    <input type="text" id="format2" placeholder="Format2"></input>
    <select id="selectionNewlines2" aria-label="Selected text line breaks for format 2">
      <option value="spaces" selected>Convert to spaces</option>
      <option value="preserve">Keep newlines as-is</option>
    </select>
    <input type="checkbox" id="html2"></input>

      <button type="button" class="moveButton" data-index="3" data-direction="down" aria-label="Move item 3 down"
        title="Move down">↓</button>

    <input type="text" id="title4" placeholder="Title4"></input>
    <input type="text" id="format4" placeholder="Format4"></input>
    <select id="selectionNewlines4" aria-label="Selected text line breaks for format 4">
      <option value="spaces" selected>Convert to spaces</option>

      <label for="createSubmenusCheckbox">Create submenus</label>
    </div>

    <div id="btnGroup">
      <button type="button" class="btn btn-primary" id="saveButton">Save changes</button>
      <button type="button" class="btn" id="restoreDefaultsButton">Restore defaults</button>
    </div>

  </form>
</body>

</html>
