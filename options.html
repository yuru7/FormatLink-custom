<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>FormatLink settings</title>
<link rel="stylesheet" href="options.css"></link>
<script src="options.js"></script>
</head>
<body>
<h1>FormatLink settings</h1>
<form>

<span class="label">Move</span>
<span class="label">Title</span>
<span class="label">Format</span>
<span class="label">HTML</span>

<div class="moveControls">
<button type="button" class="moveButton" data-index="1" data-direction="up" aria-label="Move item 1 up" title="Move up" disabled>↑</button>
<button type="button" class="moveButton" data-index="1" data-direction="down" aria-label="Move item 1 down" title="Move down">↓</button>
</div>
<input type="text" id="title1" placeholder="Title1"></input>
<input type="text" id="format1" placeholder="Format1"></input>
<input type="checkbox" id="html1"></input>

<div class="moveControls">
<button type="button" class="moveButton" data-index="2" data-direction="up" aria-label="Move item 2 up" title="Move up">↑</button>
<button type="button" class="moveButton" data-index="2" data-direction="down" aria-label="Move item 2 down" title="Move down">↓</button>
</div>
<input type="text" id="title2" placeholder="Title2"></input>
<input type="text" id="format2" placeholder="Format2"></input>
<input type="checkbox" id="html2"></input>

<div class="moveControls">
<button type="button" class="moveButton" data-index="3" data-direction="up" aria-label="Move item 3 up" title="Move up">↑</button>
<button type="button" class="moveButton" data-index="3" data-direction="down" aria-label="Move item 3 down" title="Move down">↓</button>
</div>
<input type="text" id="title3" placeholder="Title3"></input>
<input type="text" id="format3" placeholder="Format3"></input>
<input type="checkbox" id="html3"></input>

<div class="moveControls">
<button type="button" class="moveButton" data-index="4" data-direction="up" aria-label="Move item 4 up" title="Move up">↑</button>
<button type="button" class="moveButton" data-index="4" data-direction="down" aria-label="Move item 4 down" title="Move down">↓</button>
</div>
<input type="text" id="title4" placeholder="Title4"></input>
<input type="text" id="format4" placeholder="Format4"></input>
<input type="checkbox" id="html4"></input>

<div class="moveControls">
<button type="button" class="moveButton" data-index="5" data-direction="up" aria-label="Move item 5 up" title="Move up">↑</button>
<button type="button" class="moveButton" data-index="5" data-direction="down" aria-label="Move item 5 down" title="Move down">↓</button>
</div>
<input type="text" id="title5" placeholder="Title5"></input>
<input type="text" id="format5" placeholder="Format5"></input>
<input type="checkbox" id="html5"></input>

<div class="moveControls">
<button type="button" class="moveButton" data-index="6" data-direction="up" aria-label="Move item 6 up" title="Move up">↑</button>
<button type="button" class="moveButton" data-index="6" data-direction="down" aria-label="Move item 6 down" title="Move down">↓</button>
</div>
<input type="text" id="title6" placeholder="Title6"></input>
<input type="text" id="format6" placeholder="Format6"></input>
<input type="checkbox" id="html6"></input>

<div class="moveControls">
<button type="button" class="moveButton" data-index="7" data-direction="up" aria-label="Move item 7 up" title="Move up">↑</button>
<button type="button" class="moveButton" data-index="7" data-direction="down" aria-label="Move item 7 down" title="Move down">↓</button>
</div>
<input type="text" id="title7" placeholder="Title7"></input>
<input type="text" id="format7" placeholder="Format7"></input>
<input type="checkbox" id="html7"></input>

<div class="moveControls">
<button type="button" class="moveButton" data-index="8" data-direction="up" aria-label="Move item 8 up" title="Move up">↑</button>
<button type="button" class="moveButton" data-index="8" data-direction="down" aria-label="Move item 8 down" title="Move down">↓</button>
</div>
<input type="text" id="title8" placeholder="Title8"></input>

<input type="checkbox" id="html8"></input>

<div class="moveControls">
<button type="button" class="moveButton" data-index="9" data-direction="up" aria-label="Move item 9 up" title="Move up">↑</button>
<button type="button" class="moveButton" data-index="9" data-direction="down" aria-label="Move item 9 down" title="Move down" disabled>↓</button>
</div>
<input type="text" id="title9" placeholder="Title9"></input>
<input type="text" id="format9" placeholder="Format9"></input>
<input type="checkbox" id="html9"></input>

<div id="createSubmenusRow">
  <input type="checkbox" id="createSubmenusCheckbox"></input>
  <label for="createSubmenusCheckbox">Create submenus</label>
</div>

<div id="btnGroup">
<button type="button" class="btn btn-primary" id="saveButton">Save changes</button>
<button type="button" class="btn" id="restoreDefaultsButton">Restore defaults</button>
</div>

</form>
</body>
</html>
